name: Python checks

on:
  push:
    branches: [master, "modernize/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Lint source and tests
        run: ruff check src tests
      - name: Test
        run: python -m pytest -q
      - name: Train on versioned historical data
        run: car-price train --folds 3 --output artifacts
      - name: Archive reproducible metrics and plots
        uses: actions/upload-artifact@v4
        with:
          name: historical-baseline
          path: |
            artifacts/metrics.json
            artifacts/holdout_predictions.csv
            artifacts/actual_vs_predicted.png
            artifacts/residuals.png
          if-no-files-found: error
