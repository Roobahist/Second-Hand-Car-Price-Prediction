name: Python checks

on:
  push:
    branches: [master, "modernize/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Lint source and tests
        run: ruff check src tests Crawl/divar_crawler/divar_crawler/spiders/Divar.py Crawl/divar_crawler/divar_crawler/items.py Crawl/divar_crawler/concate_cars_csv.py Crawl/pishpardazesh_data_divar.py
      - name: Test
        run: python -m pytest -q
      - name: Train on versioned historical data
        run: car-price train --folds 3 --output artifacts
      - name: Archive reproducible metrics and plots
        uses: actions/upload-artifact@v7
        with:
          name: historical-baseline
          path: |
            artifacts/metrics.json
            artifacts/holdout_predictions.csv
            artifacts/actual_vs_predicted.png
            artifacts/residuals.png
          if-no-files-found: error
