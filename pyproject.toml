[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "second-hand-car-price-prediction"
version = "0.1.0"
description = "Reproducible baseline models for historical Iranian used-car listings"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1,<3",
    "numpy>=1.26,<3",
    "scikit-learn>=1.5,<2",
    "joblib>=1.3,<2",
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
crawl = ["scrapy>=2.11,<3"]

[project.scripts]
car-price = "car_price_prediction.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
